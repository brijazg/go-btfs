name: BTFS maintenance checks

on:
  push:
    branches:
      - maintenance/btfs-4.1.1-rc1
  pull_request:
    branches:
      - master
      - release-*
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: btfs-maintenance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-checks:
    name: Go build, tests, vet, and module verification
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify module checksums
        run: go mod verify

      - name: Run unit tests
        run: go test ./...

      - name: Run go vet
        run: go vet ./...

      - name: Build all packages
        run: go build ./...
